<mat-table class="order-table" [dataSource]="orderObjectForDisplay">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Size Column -->
    <ng-container matColumnDef="size">
        <th mat-header-cell *matHeaderCellDef> Size </th>
        <td mat-cell *matCellDef="let element"> {{element.size}} </td>
    </ng-container>

    <!-- Qty Column -->
    <ng-container matColumnDef="qty">
        <th mat-header-cell *matHeaderCellDef> Qty </th>
        <td mat-cell *matCellDef="let element"> {{element.qty}} </td>
    </ng-container>

    <ng-container matColumnDef="remove">
        <th mat-header-cell *matHeaderCellDef> Remove </th>
        <td mat-cell *matCellDef="let element"> 
            <a type="button">
                <mat-icon id='deleteIcon' class="icon" (click)='removeItem(element)'>delete</mat-icon>
            </a> 
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</mat-table>
<p class="order-total">Total £{{total}}</p>
<div class='button-div'>
    <button mat-raised-button mat-dialog-close 
        id='submit'
        (click)='onSave()'>Submit Order</button>
    <button mat-raised-button mat-dialog-close
        id='back'
        (click)='onBack()'>Back</button>
</div>
