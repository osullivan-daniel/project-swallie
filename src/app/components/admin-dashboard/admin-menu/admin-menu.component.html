<div class=mainDiv *ngFor="let eachItem of avilableProducts">
    <mat-card>
        <mat-card-title>{{eachItem.name}}</mat-card-title>
        <mat-table #table [dataSource]=eachItem.sizeData>

            <!-- size Column -->
            <ng-container matColumnDef="size">
                <td mat-cell *matCellDef="let element"> 
                    <mat-checkbox [checked]="element.available"
                                  (change)="selectDialogOptions($event, element, eachItem)">
                                  {{element.size}} 
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- price Column -->
            <ng-container matColumnDef="price">
                <td mat-cell *matCellDef="let element"> 
                    <label for="price">Price</label>
                    <input type="text" 
                           [disabled]="!element.available" 
                           value="{{element.price}}">
                </td>
            </ng-container>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </mat-table>

        <div class='button-div'>
            <button mat-raised-button
                    id='update'
                    [style.visibility]="false ? 'hidden': 'visible'"
                    (click)='onSave(eachItem)'>
                    Update Product Avalability
            </button>
        </div>

    </mat-card>
</div>
