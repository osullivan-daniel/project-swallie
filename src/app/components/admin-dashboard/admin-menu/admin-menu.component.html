<div class=mainDiv>
    <div *ngFor="let eachItem of listWithDetailsTest let i=index">
        <mat-card class="swally-card">
            <form [formGroup]="menuGroupArray.controls[i]" (ngSubmit)="onSubmit(eachItem)">
                <!-- <form [formControl]="menuGroup.controls[i]"> -->
                    <mat-card-title>{{eachItem.name}}</mat-card-title>
                    <mat-table #table [dataSource]=eachItem.sizeData>
                        <!-- *matCellDef="let row; let index = index" [formGroupName]="index" -->

                        <!-- size Column -->
                        <ng-container matColumnDef="size">
                            <td mat-cell *matCellDef="let element; let rowIndex = index" [formGroupName]="rowIndex">
                                <mat-checkbox formControlName="size" 
                                              [checked]="element.available"
                                              (change)="selectDialogOptions(eachItem, element, 
                                                        menuGroupArray.controls[i].controls[rowIndex],
                                                        menuGroupArray.controls[i])">
                                              {{element.size}} 
                                </mat-checkbox>
                            </td>
                        </ng-container>
                            
                        <!-- price Column -->
                        <ng-container matColumnDef="price">
                            <td mat-cell *matCellDef="let element; let rowIndex = index" [formGroupName]="rowIndex">
                                <label for="price">Price</label>
                                <input type="number" 
                                       value="{{element.price}}"
                                       formControlName="price"
                                       (input)="enterText(eachItem, element, 
                                                menuGroupArray.controls[i].controls[rowIndex],
                                                menuGroupArray.controls[i])">
                            </td>
                        </ng-container>
                        
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    </mat-table>



                    <div class='button-div'>
                        <button mat-raised-button
                                id='update'
                                [style.visibility]="eachItem.updateButtonVisable ? 'visible': 'hidden'">
                                Update Product Avalability
                        </button>
                    </div>     
                <!-- </form> -->
                </form>
        </mat-card>
    </div>
</div>
