<div class=mainDiv *ngFor="let eachItem of availableProductsLocal">
    <mat-card>
        <mat-card-title>{{eachItem.name}}</mat-card-title>
        <mat-table #table [dataSource]="sizeData">

            <!-- Name Column -->
            <ng-container matColumnDef="size">
                <td mat-cell *matCellDef="let element"> 
                    <mat-checkbox
                    [checked]="element.available"
                    (change)="selectDialogOptions($event, element.size)">
                        {{element.size}} 
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Size Column -->
            <ng-container matColumnDef="price">
                <td mat-cell *matCellDef="let element"> 
                    <label for="price">Price</label>
                    <input type="text" [disabled]="!element.available" value="{{element.price}}">
                </td>

            </ng-container>

            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </mat-table>
    </mat-card>
</div>
