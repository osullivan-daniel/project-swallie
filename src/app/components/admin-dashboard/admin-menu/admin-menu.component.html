<mat-nav-list>
  <mat-list-item id=cardItemList>
      <mat-nav-list>
          <mat-list-item id=cardItemList *ngFor="let eachOrder of avilableProducts;">
              <mat-card>
                  <mat-table id=tableTest [dataSource]="eachOrder">
                      <ng-container matColumnDef="size">
                          <th mat-header-cell *matHeaderCellDef> Size </th>
                          <td mat-cell *matCellDef="let element"> {{element.size}} </td>
                      </ng-container>
                  
                      <ng-container matColumnDef="price">
                          <th mat-header-cell *matHeaderCellDef> Price </th>
                          <td mat-cell *matCellDef="let element"> {{element.price}} </td>
                      </ng-container>

                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                  </mat-table>
                  <div class='button-div'>
                      <button mat-raised-button
                      id='completeButton'
                      [disabled]="disableOrderButton"
                      (click)='displayConfirmation(eachOrder, i)'>Complete</button>
                  </div>
              </mat-card>
          </mat-list-item>
      </mat-nav-list>
  </mat-list-item>
</mat-nav-list>
