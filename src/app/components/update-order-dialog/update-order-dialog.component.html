<h2 id='dialogHeader'>{{data}}</h2>

        <mat-table #table [dataSource]="orderOptionsForDisplay">
        
            <ng-container matColumnDef="size">
                <th mat-header-cell *matHeaderCellDef> Size </th>
                <td mat-cell *matCellDef="let element"> 
                    <mat-checkbox 
                        [checked]="element.addToOrder"
                        (change)="selectDialogOptions($event, element.size)">
                        {{element.size}}
                    </mat-checkbox>
                </td>



            </ng-container>
        
            <ng-container matColumnDef="qty">
                <th mat-header-cell *matHeaderCellDef> Qty </th>
                <td mat-cell *matCellDef="let element"> 
                    
                    <mat-select id='quantitySelect' [disabled]="!element.addToOrder" [value]="element.qty">
                        <mat-option *ngFor="let num of availableToOrder" 
                                    [value]=num
                                    (click)="selectDropdownValue(element.size, num)">
                                    {{ num }}
                        </mat-option>
                    </mat-select>
                
                </td>
            </ng-container>
        
            <!-- <ng-container matColumnDef="remove">
                <th mat-header-cell *matHeaderCellDef> Remove </th>

                    </a> 
                </td>
              </ng-container> -->
        
            <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> -->
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
</mat-table>
<div class='button-div'>
    <button mat-raised-button mat-dialog-close 
            [disabled]="disableOrderButton"
            (click)='onSave()'>Update order</button>
    <button mat-raised-button mat-dialog-close
            (click)='onBack()'>Back</button>
</div>
