<h2>Completed</h2>

<mat-nav-list>
  <div>
    <mat-nav-list>
      @for (eachOrder of localCompleted; track eachOrder; let i = $index) {
        <div class="swally-item-list">
          <mat-card class="swally-card">
            <mat-table class="swally-table" [dataSource]="eachOrder.orderItems">
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Product Name</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.productName }}
                </td>
              </ng-container>
              <ng-container matColumnDef="size">
                <th mat-header-cell *matHeaderCellDef>Product Size</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.productSize }}
                </td>
              </ng-container>
              <ng-container matColumnDef="qty">
                <th mat-header-cell *matHeaderCellDef>Qty</th>
                <td mat-cell *matCellDef="let element">{{ element.qty }}</td>
              </ng-container>
              <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef>Item Price</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.itemPrice | currency: currencyCode }}
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </mat-table>
            <div class="swally-button-div">
              <button
                mat-raised-button
                class="swally-button"
                (click)="displayConfirmation(eachOrder)">
                Review Order Details
              </button>
            </div>
          </mat-card>
        </div>
      }
    </mat-nav-list>
  </div>
</mat-nav-list>
