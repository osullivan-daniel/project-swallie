services:
  postgres:
    image: postgres:17
    container_name: swallie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swallie
      POSTGRES_USER: swallie
      POSTGRES_PASSWORD: swallie_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: